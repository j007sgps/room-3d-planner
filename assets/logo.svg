<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Isometric floor slab (10%+ margin preserved) -->
  <polygon points="64,104 20,80 64,56 108,80" fill="#0F172A" fill-opacity="0.18" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" />

  <!-- Subtle floor grid lines -->
  <line x1="42" y1="92" x2="86" y2="68" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2" />
  <line x1="42" y1="68" x2="86" y2="92" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2" />

  <!-- Back-left cutaway wall -->
  <polygon points="20,80 20,40 64,16 64,56" fill="#38BDF8" fill-opacity="0.24" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" />

  <!-- Back-right cutaway wall -->
  <polygon points="64,56 64,16 108,40 108,80" fill="#10B981" fill-opacity="0.22" stroke="#10B981" stroke-width="4" stroke-linejoin="round" />

  <!-- Window cutout on back-right wall -->
  <polygon points="74,47 74,31 96,43 96,59" fill="#F8FAFC" fill-opacity="0.7" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Furniture footprint block in room -->
  <polygon points="64,90 48,81 62,73 78,82" fill="#F59E0B" fill-opacity="0.85" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Dimension / caliper tick lines -->
  <line x1="20" y1="94" x2="64" y2="118" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="16" y1="97" x2="24" y2="91" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="60" y1="121" x2="68" y2="115" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
</svg>
